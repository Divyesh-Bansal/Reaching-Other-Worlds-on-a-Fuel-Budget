[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hohmann-simulator"
version = "0.1.0"
description = "Animated Hohmann orbital transfer simulator with physics engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["orbital-mechanics", "hohmann-transfer", "space", "simulation", "matplotlib"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
hohmann = "hohmann_simulator:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["hohmann*", "orbital*"]
